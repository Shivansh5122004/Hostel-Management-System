<div class="container">

    <h1 class="page-title">
        Contact Us
    </h1>


    <div class="form-box">

        <form id="contactForm"
              onsubmit="sendContact(event)">

            <div class="form-grid">

                <div class="form-group">

                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        required>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        required>

                </div>


                <div class="form-group full">

                    <label>Subject</label>

                    <input
                        type="text"
                        name="subject"
                        required>

                </div>


                <div class="form-group full">

                    <label>Message</label>

                    <textarea
                        name="message"
                        required></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Send Message

                </button>

            </div>

        </form>


        <div id="contactMessage"
             class="message">
        </div>

    </div>


    <div class="info-grid">

        <div class="info-card">

            <h3>🏠 Hostel Office</h3>

            <p>
                Hostel Management Office
            </p>

        </div>


        <div class="info-card">

    <h3>📞 Phone</h3>

        +91 6392940153

</div>
