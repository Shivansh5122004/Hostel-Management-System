<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notices - Hostel Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🏠 Hostel<span>Management</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="students.html">Students</a>
        <a href="Rooms.html">Rooms</a>
        <a href="Allocation.html">Allocation</a>
        <a href="fees.html">Fees</a>
        <a href="complaints.html">Complaints</a>
        <a href="notices.html">Notices</a>
        <a href="visitors.html">Visitors</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<div class="container">

    <h1 class="page-title">
        Notice Management
    </h1>


    <div class="form-box">

        <form id="noticeForm"
              onsubmit="addNotice(event)">

            <div class="form-grid">

                <div class="form-group">

                    <label>Notice Title</label>

                    <input
                        type="text"
                        name="title"
                        required>

                </div>


                <div class="form-group">

                    <label>Notice Date</label>

                    <input
                        type="date"
                        name="notice_date"
                        required>

                </div>


                <div class="form-group full">

                    <label>Notice Message</label>

                    <textarea
                        name="message"
                        required></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Publish Notice

                </button>

            </div>

        </form>


        <div id="noticeMessage"
             class="message">
        </div>

    </div>


    <h2 class="page-title">
        Published Notices
    </h2>

    <div id="noticeContainer">

        Loading...

    </div>

</div>


<footer class="footer">

    © 2026 Hostel Management System | Notices

</footer>


<script src="app.js"></script>

</body>

</html>
