<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fees - Hostel Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🏠 Hostel<span>Management</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="students.html">Students</a>
        <a href="Rooms.html">Rooms</a>
        <a href="Allocation.html">Allocation</a>
        <a href="fees.html">Fees</a>
        <a href="complaints.html">Complaints</a>
        <a href="notices.html">Notices</a>
        <a href="visitors.html">Visitors</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<div class="container">

    <h1 class="page-title">
        Fee Management
    </h1>


    <div class="form-box">

        <form id="feeForm"
              onsubmit="addFee(event)">

            <div class="form-grid">

                <div class="form-group">

                    <label>Student Name</label>
                    <input type="hidden" name="student_id" value="1">

                    <input
                        type="text"
                        name="student_name"
                        required>

                </div>


                <div class="form-group">

                    <label>Amount</label>

                    <input
                        type="number"
                        name="amount"
                        min="0"
                        required>

                </div>

<div class="form-group">
    <label>Fee Type</label>
    <select id="fee_type" name="fee_type">
        <option value="Hostel Fee">Hostel Fee</option>
        <option value="Mess Fee">Mess Fee</option>
        <option value="Other">Other</option>
    </select>
</div>
                <div class="form-group">

<label>Payment Method</label>

<select id="payment_method" name="payment_method">

<option value="Cash">Cash</option>

<option value="UPI">UPI</option>

<option value="Card">Card</option>

<option value="Online">Online</option>

</select>

</div>

                    

                </div>


                <div class="form-group">

                    <label>Payment Status</label>
<select id="status" name="status">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Paid">
                            Paid
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Payment Date</label>

                    <input
                        type="date"
                        name="payment_date">

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Add Fee Record

                </button>

            </div>

        </form>


        <div id="feeMessage"
             class="message">
        </div>

    </div>


    <div class="table-box">

        <h2 class="page-title">
            Fee Records
        </h2>

        <table>

            <thead>

                <tr>
                      <tr>
    <th>ID</th>
    <th>Student</th>
    <th>Amount</th>
    <th>Fee Type</th>
    <th>Status</th>
    <th>Date</th>
</tr>


            </thead>

            <tbody id="feeTableBody">

                <tr>
                    <td colspan="6">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<footer class="footer">

    © 2026 Hostel Management System | Fee Management

</footer>


<script src="app.js"></script>
<script>
loadFees();
</script>
</body>

</html>
