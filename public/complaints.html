<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Complaints - Hostel Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🏠 Hostel<span>Management</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="students.html">Students</a>
        <a href="Rooms.html">Rooms</a>
        <a href="Allocation.html">Allocation</a>
        <a href="fees.html">Fees</a>
        <a href="complaints.html">Complaints</a>
        <a href="notices.html">Notices</a>
        <a href="visitors.html">Visitors</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<div class="container">

    <h1 class="page-title">
        Complaint Management
    </h1>


    <div class="form-box">

        <form id="complaintForm"
              onsubmit="addComplaint(event)">

            <div class="form-grid">

                <div class="form-group">

                    <label>Student Name</label>

                    <input
                        type="text"
                        name="student_name"
                        required>

                </div>


                <div class="form-group">

                    <label>Subject</label>

                    <input
                        type="text"
                        name="subject"
                        required>

                </div>


                <div class="form-group full">

                    <label>Complaint</label>

                    <textarea
                        name="complaint"
                        required></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Submit Complaint

                </button>

            </div>

        </form>


        <div id="complaintMessage"
             class="message">
        </div>

    </div>


    <div class="table-box">

        <h2 class="page-title">
            Complaint Records
        </h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Student</th>
                    <th>Subject</th>
                    <th>Complaint</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="complaintTableBody">

                <tr>
                    <td colspan="5">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<footer class="footer">

    © 2026 Hostel Management System | Complaints

</footer>


<script src="app.js"></script>

</body>

</html>
