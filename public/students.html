<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Students - Hostel Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🏠 Hostel<span>Management</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="students.html">Students</a>
        <a href="Rooms.html">Rooms</a>
        <a href="Allocation.html">Allocation</a>
        <a href="fees.html">Fees</a>
        <a href="complaints.html">Complaints</a>
        <a href="notices.html">Notices</a>
        <a href="visitors.html">Visitors</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<div class="container">

    <h1 class="page-title">
        Student Management
    </h1>


    <div class="form-box">

        <form id="studentForm"
              onsubmit="addStudent(event)">

            <div class="form-grid">

                <div class="form-group">

                    <label>Student Name</label>

                    <input
                        type="text"
                        name="name"
                        required>

                </div>


                <div class="form-group">

                    <label>Roll Number</label>

                    <input
                        type="text"
                        name="roll_no"
                        required>

                </div>


                <div class="form-group">

                    <label>Course</label>

                    <input
                        type="text"
                        name="course"
                        placeholder="BCA"
                        required>

                </div>


                <div class="form-group">

                    <label>Year</label>

                    <select name="year" required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        name="phone"
                        required>

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        required>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    + Add Student

                </button>

            </div>

        </form>


        <div id="studentMessage"
             class="message">
        </div>

    </div>


    <div class="table-box">

        <h2 class="page-title">
            Student Records
        </h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Course</th>
                    <th>Year</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="studentTableBody">

                <tr>
                    <td colspan="8">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<footer class="footer">

    © 2026 Hostel Management System | Student Management

</footer>


<script src="app.js"></script>

</body>

</html>
