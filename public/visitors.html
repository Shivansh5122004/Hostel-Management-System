<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitors - Hostel Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        🏠 Hostel<span>Management</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="students.html">Students</a>
        <a href="Rooms.html">Rooms</a>
        <a href="Allocation.html">Allocation</a>
        <a href="fees.html">Fees</a>
        <a href="complaints.html">Complaints</a>
        <a href="notices.html">Notices</a>
        <a href="visitors.html">Visitors</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<div class="container">

    <h1 class="page-title">
        Visitor Management
    </h1>


    <div class="form-box">

        <form id="visitorForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>Visitor Name</label>

                    <input
                        type="text"
                        name="visitor_name"
                        required>

                </div>


                <div class="form-group">

                    <label>Student Name</label>

                    <input
                        type="text"
                        name="student_name"
                        required>

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        required>

                </div>


                <div class="form-group">

                    <label>Purpose</label>

                    <input
                        type="text"
                        name="purpose"
                        required>

                </div>


                <div class="form-group">

                    <label>Visit Date</label>

                    <input
                        type="date"
                        name="visit_date"
                        required>

                </div>


                <div class="form-group">

                    <label>Visit Time</label>

                    <input
                        type="time"
                        name="visit_time"
                        required>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Add Visitor

                </button>

            </div>

        </form>


        <div
            id="visitorMessage"
            class="message">
        </div>

    </div>


    <h2 class="page-title">
        Visitor Records
    </h2>


    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Visitor</th>
                    <th>Student</th>
                    <th>Phone</th>
                    <th>Purpose</th>
                    <th>Date</th>
                    <th>Time</th>

                </tr>

            </thead>


            <tbody id="visitorTableBody">

                <tr>
                    <td colspan="7">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<footer class="footer">

    © 2026 Hostel Management System | Visitors

</footer>


<script src="app.js"></script>

</body>

</html>
